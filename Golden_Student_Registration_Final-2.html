<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration | Golden Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:36px 16px;display:grid;place-items:center;font-family:Arial,sans-serif;color:#17130b;background:radial-gradient(ellipse at 15% 15%,#fff0c2 0,transparent 28%),radial-gradient(ellipse at 85% 80%,#b77d20 0,transparent 30%),linear-gradient(135deg,#f8e9bd,#d4aa50 48%,#f7e9c6 70%,#b9872d);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none;border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 0 35px rgba(255,255,255,.35),0 18px 55px rgba(91,59,8,.18)}
body:before{width:70vw;height:70vw;right:-25vw;top:-20vw;border-radius:45% 55% 60% 40%;transform:rotate(32deg);background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(190,139,36,.25),rgba(255,255,255,.65))}
body:after{width:62vw;height:62vw;left:-25vw;bottom:-27vw;border-radius:60% 40% 45% 55%;transform:rotate(-28deg);background:linear-gradient(145deg,rgba(255,255,255,.65),rgba(193,143,43,.25),rgba(255,248,220,.7))}
.wrap{width:min(100%,650px);position:relative;z-index:1}
.card{padding:clamp(25px,5vw,46px);border:1px solid rgba(255,255,255,.85);border-radius:26px;background:linear-gradient(135deg,rgba(255,252,240,.82),rgba(255,247,222,.62));box-shadow:0 24px 70px rgba(75,49,7,.22),inset 0 1px 0 white;backdrop-filter:blur(18px)}
.brand{text-align:center;margin-bottom:25px}.mark{width:52px;height:52px;margin:auto auto 10px;display:grid;place-items:center;border-radius:16px;color:#fff9e8;font-size:26px;background:linear-gradient(145deg,#e3bd63,#95620e);box-shadow:0 8px 20px #84590d40}
.brand small{letter-spacing:.22em;font-weight:bold}h1{text-align:center;font-size:clamp(25px,5vw,34px);margin:20px 0 8px}.intro{text-align:center;color:#665b45;margin:0;font-size:14px}
form{margin-top:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px 15px}.field{min-width:0}.full,fieldset{grid-column:1/-1}
label,legend{display:block;margin:0 0 8px 2px;font-size:14px;font-weight:bold;color:#302716}
input[type=text],input[type=email],input[type=tel],select{width:100%;min-height:48px;padding:12px 13px;border:1.5px solid #a98a4d99;border-radius:10px;background:#ffffffa8;color:#17130b;font:inherit;outline:none}
input::placeholder{color:#887b61;opacity:1}select:invalid{color:#887b61}select option{color:#17130b}
input:focus,select:focus{border-color:#a87617;box-shadow:0 0 0 3px #c99a352e}
fieldset{margin:0;padding:13px 15px 15px;border:1.5px solid #a98a4d99;border-radius:10px}fieldset legend{padding:0 5px}
.gender-hint{margin:0 0 10px;color:#887b61;font-size:13px}.choice{display:inline-flex;align-items:center;gap:7px;margin:2px 22px 0 0;font-weight:normal}.choice input{width:16px;height:16px;accent-color:#a87617}
button{width:100%;min-height:53px;margin-top:23px;border:1px solid #ffffffb8;border-radius:11px;color:#fffdf5;font-size:17px;font-weight:bold;letter-spacing:.04em;background:linear-gradient(110deg,#9f6d16,#e0b957 50%,#9f6d16);box-shadow:0 9px 22px #82570d40;cursor:pointer}
button:hover{filter:brightness(1.06)}.note{text-align:center;margin:20px 0 0;color:#665b45;font-size:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.full,fieldset{grid-column:auto}.card{border-radius:21px}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="brand"><div class="mark">✦</div><small>STUDENT PORTAL</small></div>
<h1>Student Registration</h1>
<p class="intro">Welcome. Please enter your details to register.</p>
<form action="#" method="post"><div class="grid">
<div class="field full"><label for="name">Full Name</label><input id="name" name="name" type="text" placeholder="John Doe" required></div>
<div class="field"><label for="matric">Matric Number</label><input id="matric" name="matric" type="text" placeholder="20235555" required></div>
<div class="field"><label for="department">Department</label><select id="department" name="department" required><option value="" disabled selected>Select your department</option><option>Computer Science</option><option>Information Technology</option><option>Software Engineering</option><option>Cyber Security</option><option>Other</option></select></div>
<div class="field"><label for="email">Email Address</label><input id="email" name="email" type="email" placeholder="e.g. john@example.com" required></div>
<div class="field"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" placeholder="e.g. 08012345678" required></div>
<fieldset><legend>Gender</legend><p class="gender-hint">Select your gender</p><label class="choice"><input type="radio" name="gender" value="Male" required> Male</label><label class="choice"><input type="radio" name="gender" value="Female"> Female</label></fieldset>
<div class="field full"><label for="programme">Programme</label><select id="programme" name="programme" required><option value="" disabled selected>Select your programme</option><option>Full-Time</option><option>Part-Time</option><option>Distance Learning</option></select></div>
</div><button type="submit">Submit Registration</button></form>
<p class="note">STUDENT REGISTRATION • HTML PRACTICAL</p>
</main></div>
</body>
</html>
